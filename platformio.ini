; PlatformIO Project Configuration File
; Polyphonion - Eurorack Synthesizer with Norns-style GUI
; Teensy 4.1 with ILI9488 Display

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Build flags for optimization and display configuration
build_flags = 
    -D CORE_TEENSY
    -D USB_SERIAL
    -D F_CPU=600000000
    -D TFT_DC=9
    -D TFT_CS=10
    -D TFT_RST=8
    -D TFT_MOSI=11
    -D TFT_SCLK=13
    -D TFT_MISO=12
    -D SCREEN_WIDTH=320
    -D SCREEN_HEIGHT=480
    -I include/
    -D USER_SETUP_LOADED
    -D ILI9488_DRIVER
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_ROTATION=1
    -D TFT_RGB_ORDER
    -D TFT_BGR=1
    -D SPI_FREQUENCY=30000000
    -D SPI_READ_FREQUENCY=6000000

; Libraries for display and graphics
lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    XPT2046_Touchscreen
    adafruit/Adafruit MCP4725@^2.0.0

; Monitor configuration
monitor_speed = 115200

; Upload configuration
upload_protocol = teensy-gui
