; PlatformIO Project Configuration File
; TeensySynth - Eurorack Synthesizer with Norns-style GUI
; Teensy 4.1 with ILI9341 Display

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Build flags for optimization and display configuration
build_flags = 
    -D CORE_TEENSY
    -D USB_SERIAL
    -D F_CPU=600000000
    -D TFT_DC=9
    -D TFT_CS=10
    -D TFT_RST=8
    -D TFT_MOSI=11
    -D TFT_SCLK=13
    -D TFT_MISO=12

; Libraries for display and graphics
lib_deps =
    ILI9341_t3
    XPT2046_Touchscreen
    adafruit/Adafruit MCP4725@^2.0.0

; Monitor configuration
monitor_speed = 115200

; Upload configuration
upload_protocol = teensy-gui
